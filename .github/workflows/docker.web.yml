name: web

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-web
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Check out dev
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        ref: dev
        persist-credentials: false

    - name: Record source revision
      id: source
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Set up QEMU
      uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      with:
        platforms: arm64

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

    - name: Log in to Docker Hub
      env:
        DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      run: printf '%s' "$DOCKER_HUB_TOKEN" | docker login -u "$DOCKER_HUB_USERNAME" --password-stdin docker.io

    - name: Build dev and publish web
      env:
        SOURCE_SHA: ${{ steps.source.outputs.sha }}
      run: |
        docker buildx build --platform linux/amd64,linux/arm64 --pull --no-cache \
          --label "org.opencontainers.image.revision=$SOURCE_SHA" \
          -t docker.io/mpgagebioinformatics/mcs_bead_proj:web --push .
        echo "Published mpgagebioinformatics/mcs_bead_proj:web from dev commit $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

    - name: Log out of Docker Hub
      if: always()
      run: docker logout docker.io
